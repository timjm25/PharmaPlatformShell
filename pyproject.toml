[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-platform-shell"
version = "0.1.0"
description = "Identity, RBAC, API gateway, runtime service registry and audit-by-default for the virtual pharma platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tim Maguire" }]
dependencies = [
    "Flask>=3.0",
    "PyJWT[crypto]>=2.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
dev = ["pytest>=8", "jsonschema>=4.18", "referencing>=0.30"]

[project.scripts]
platform-shell = "platform_shell.cli:main"

[tool.setuptools.packages.find]
include = ["platform_shell*"]

[tool.setuptools.package-data]
platform_shell = ["_vendor/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
